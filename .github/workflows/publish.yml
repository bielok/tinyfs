name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bunx tsc --noEmit

      - run: bun run build

      - run: bun test --timeout 30000

      - name: Publish to npm
        run: npm publish --provenance
